# /etc/nginx/sites-available/techrag  (cambia TU_DOMINIO por tu dominio de DuckDNS)
server {
    listen 80;
    server_name rag.TU_DOMINIO.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE de /api/ask: sin buffer para que los tokens lleguen en vivo
        proxy_buffering off;
        proxy_cache off;

        # La ingesta de un repo grande puede tardar varios minutos
        proxy_read_timeout 900s;
    }
}
